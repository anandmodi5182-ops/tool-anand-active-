<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>લેટરપેડ અને ફાઈલ ટાઈટલ પેજ મેકર – CRC આદ્યશક્તિ ઇન્દિરા</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--c1:#1e5aa8;--c2:#2bb3ff}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:radial-gradient(circle at 10% 0,#2c2570,#141133 60%);color:#fff;font-family:"Noto Sans Gujarati","Shruti",system-ui,sans-serif;min-height:100vh}
.top{text-align:center;padding:16px 10px 4px}
.top h1{margin:0;font-size:clamp(20px,5vw,30px);background:linear-gradient(90deg,#ffd45c,#ff7aa2);-webkit-background-clip:text;background-clip:text;color:transparent}
.top p{margin:4px 0 0;color:#c9c6f5;font-size:13px}
.panel{max-width:980px;margin:10px auto;padding:14px;background:#ffffff12;border:1px solid #ffffff30;border-radius:18px;backdrop-filter:blur(8px)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.panel label{display:block;font-size:12px;color:#c9c6f5;margin-bottom:3px;font-weight:600}
.panel input[type=text],.panel input[type=file]{width:100%;padding:10px;border-radius:10px;border:1px solid #ffffff40;background:#0006;color:#fff;font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.seg button,.act button{padding:11px 14px;border-radius:12px;border:2px solid #ffffff40;background:#ffffff14;color:#fff;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px}
.seg button.on{border-color:#ffd45c;background:#ffb30033;box-shadow:0 0 14px #ffb30066}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid #fff8;box-shadow:0 4px 0 #0006}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.act .p{background:linear-gradient(180deg,#ffd45c,#ff9a00);color:#2a1a00;border:0;box-shadow:0 5px 0 #a85a00}
.act .p:active{transform:translateY(4px);box-shadow:0 1px 0 #a85a00}
h4{margin:8px 0 2px;font-size:14px;color:#ffd45c}
.hint{font-size:12px;color:#c9c6f5;text-align:center;margin:6px}
.fit{margin:12px auto;overflow:hidden}
.page{width:794px;height:1123px;background:#fff;color:#222;position:relative;overflow:hidden;transform-origin:0 0;box-shadow:0 20px 50px #000a;font-family:"Noto Sans Gujarati","Shruti",system-ui,sans-serif;display:flex;flex-direction:column}
.credit{position:absolute;left:calc(100% - 7px);top:50%;transform-origin:0 0;transform:rotate(90deg) translateX(-50%);white-space:nowrap;font-size:11px;line-height:14px;font-weight:700;color:#444;z-index:5;user-select:none;-webkit-user-select:none;pointer-events:none}
.credit.tpc{left:calc(100% - 24px)}
.wm{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:380px;opacity:.05;pointer-events:none}
.wm img{width:380px;opacity:1}
.logo{width:84px;height:84px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:46px;flex:none;overflow:hidden;box-shadow:0 0 0 4px #fff7,0 6px 14px #0004}
.logo img{width:100%;height:100%;object-fit:cover}
.ht{display:flex;align-items:center;gap:16px}
.ht h2{margin:0;font-size:30px;font-weight:800;line-height:1.15}
.ht p{margin:2px 0 0;font-size:16px;font-weight:600}
.ht small{display:inline-block;margin-top:4px;font-size:13px;font-weight:600;padding:2px 12px;border-radius:99px}
/* header styles */
.h1{background:linear-gradient(120deg,var(--c1),var(--c2));color:#fff;padding:26px 36px 50px;position:relative}
.h1 small{background:#ffffff33}
.h1 svg{position:absolute;left:0;bottom:-1px;width:100%;height:34px}
.h2{padding:24px 36px 12px;text-align:center;color:var(--c1);border-bottom:4px double var(--c1);margin:0 28px}
.h2 .ht{justify-content:center}.h2 .ht div{text-align:center}.h2 small{background:var(--c1);color:#fff}
.h3{display:flex;border-left:26px solid var(--c1);margin:26px 0 0;padding:6px 30px 14px;border-bottom:3px solid var(--c2)}
.h3 .ht h2{color:var(--c1)}.h3 small{background:var(--c2);color:#fff}
.h4{background:#161a33;color:#fff;padding:24px 36px 20px;border-bottom:6px solid #d4af37}
.h4 h2{color:#f2cf66}.h4 small{background:#d4af3733;color:#f2cf66;border:1px solid #d4af37}
/* footer styles */
.ft{margin-top:auto;font-size:14px;font-weight:600}
.ft .r{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;padding:12px 24px}
.f1{background:linear-gradient(120deg,var(--c1),var(--c2));color:#fff;position:relative;padding-top:18px}
.f1 svg{position:absolute;left:0;top:-1px;width:100%;height:26px}
.f2{border-top:4px double var(--c1);margin:0 28px 14px;color:var(--c1)}
.f3{border-left:26px solid var(--c1);margin-bottom:26px;border-top:3px solid var(--c2);color:var(--c1)}
.f4{background:#161a33;color:#f2cf66;border-top:6px solid #d4af37}
.bd{padding:26px 48px;flex:1;position:relative;font-size:19px;line-height:1.9}
.bd [contenteditable]:focus{outline:2px dashed var(--c2);outline-offset:3px}
.lr{display:flex;justify-content:space-between;font-weight:700}
.sig{margin-top:60px;text-align:right;font-weight:700}
/* title page */
.page.tp:before{content:"";position:absolute;inset:14px;border:3px solid var(--c1);box-shadow:inset 0 0 0 6px #fff,inset 0 0 0 8px var(--c2);z-index:2;pointer-events:none;border-radius:6px}
.page.tp .h1,.page.tp .h4{margin:0}
.tt{text-align:center;padding:30px 60px;display:flex;flex-direction:column;align-items:center;gap:14px;line-height:1.5}
.rib{background:linear-gradient(120deg,var(--c1),var(--c2));color:#fff;font-size:24px;font-weight:800;padding:6px 44px;border-radius:10px;box-shadow:0 5px 0 #0003}
.big{font-size:60px;font-weight:800;color:var(--c1);line-height:1.2;text-shadow:3px 3px 0 #0001;margin:10px 0}
.sub{font-size:24px;font-weight:600;color:#444}
.seal{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#fff,#fff 55%,var(--c2) 56%,var(--c1));display:flex;align-items:center;justify-content:center;font-size:62px;box-shadow:0 8px 20px #0004;overflow:hidden}
.seal img{width:100%;height:100%;object-fit:cover}
.tb{width:100%;border-collapse:separate;border-spacing:0 10px;font-size:21px;text-align:left}
.tb td{padding:10px 16px;background:#f3f6fb;border-left:8px solid var(--c1)}
.tb td:first-child{width:36%;font-weight:800;color:var(--c1);background:#e6edf8}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}
 .top,.panel,.hint{display:none!important}
 .fit{margin:0!important;width:auto!important;height:auto!important;overflow:visible}
 .page{transform:none!important;box-shadow:none}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="top"><h1>📄 લેટરપેડ અને ફાઈલ ટાઈટલ પેજ મેકર</h1><p>CRC આદ્યશક્તિ ઇન્દિરા ક્લસ્ટર • તૈયાર કરનાર: શ્રી આનંદભાઈ મોદી – 9427914014</p></div>

<div class="panel">
  <h4>1️⃣ શું બનાવવું છે?</h4>
  <div class="seg" id="modes">
    <button data-m="letter" class="on">✉️ લેટરપેડ (પત્ર સાથે)</button>
    <button data-m="blank">📃 ખાલી લેટરપેડ</button>
    <button data-m="title">📘 ફાઈલ ટાઈટલ પેજ</button>
  </div>
  <h4>2️⃣ હેડર–ફૂટર ડિઝાઇન</h4>
  <div class="seg" id="styles">
    <button data-s="1" class="on">🌊 વેવ</button>
    <button data-s="2">🏛️ ક્લાસિક</button>
    <button data-s="3">📐 સાઇડ બાર</button>
    <button data-s="4">👑 રોયલ</button>
  </div>
  <h4>3️⃣ રંગ</h4>
  <div class="sw" id="sw"></div>
</div>

<div class="panel">
  <h4>🏫 હેડર–ફૂટરની વિગત (બદલી શકાય)</h4>
  <div class="g">
    <div><label>નામ (હેડર)</label><input type="text" id="org" value="CRC ADHYASHAKTI INDIRA CLUSTER"></div>
    <div><label>સરનામું</label><input type="text" id="addr" value="TA. PALANPUR, DIST. BANASKANTHA"></div>
    <div><label>કોડ નંબર</label><input type="text" id="code" value="2402090001"></div>
    <div><label>કોડનું નામ</label><input type="text" id="codelbl" value="કોડ નં."></div>
    <div><label>ઈ-મેઇલ</label><input type="text" id="email" value="anand82modi@gmail.com"></div>
    <div><label>મોબાઈલ</label><input type="text" id="mob" value="9427914014"></div>
    <div><label>લોગો (ફોટો, વૈકલ્પિક)</label><input type="file" id="logo" accept="image/*"></div>
  </div>
  <div class="act">
    <button class="p" id="pdfbtn" onclick="dlPDF()">⬇️ PDF ડાઉનલોડ (પ્રિવ્યુ જેવું જ)</button>
    <button onclick="window.print()">🖨️ પ્રિન્ટ</button>
    <button onclick="resetLogo()">🗑️ લોગો કાઢો</button>
  </div>
  <div class="hint">પેજ પરનું લખાણ સીધું ક્લિક કરીને બદલી શકાય છે. PDF ડાઉનલોડ માટે ઈન્ટરનેટ ચાલુ હોવું જોઈએ.</div>
</div>

<div class="fit" id="fit"><div class="page" id="page"></div></div>

<script>
const $=id=>document.getElementById(id);
const COLS=[["#1e5aa8","#2bb3ff"],["#0f7b5f","#3ed6a0"],["#c2185b","#ff7aa2"],["#6a1b9a","#c06cff"],["#e65100","#ffb300"],["#b71c1c","#ff6b4a"]];
let mode="letter",style="1",logoURL="",bodyHTML={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()};

$("sw").innerHTML=COLS.map((c,i)=>'<i data-i="'+i+'" style="background:linear-gradient(135deg,'+c[0]+','+c[1]+')"></i>').join("")+
 '<input type="color" id="cc" value="#1e5aa8" title="પોતાનો રંગ" style="width:40px;height:36px;border:0;background:none">';
$("sw").onclick=e=>{const i=e.target.dataset.i;if(i===undefined)return;setCol(COLS[i][0],COLS[i][1])};
$("cc").oninput=e=>setCol(e.target.value,e.target.value+"cc");
function setCol(a,b){document.documentElement.style.setProperty("--c1",a);document.documentElement.style.setProperty("--c2",b)}

function seg(id,attr,fn){$(id).onclick=e=>{const b=e.target.closest("button");if(!b)return;
  [...$(id).children].forEach(x=>x.classList.toggle("on",x===b));fn(b.dataset[attr]);}}
seg("modes","m",v=>{saveBody();mode=v;build()});
seg("styles","s",v=>{saveBody();style=v;build()});
["org","addr","code","codelbl","email","mob"].forEach(i=>$(i).oninput=()=>{saveBody();build()});
$("logo").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{saveBody();logoURL=r.result;build()};r.readAsDataURL(f)};
function resetLogo(){saveBody();logoURL="";$("logo").value="";build()}

function logoH(){return logoURL?'<img src="'+logoURL+'">':"🏫"}
function head(){
  const t='<div class="ht"><div class="logo">'+logoH()+'</div><div><h2 contenteditable data-f="org">'+esc($("org").value)+'</h2><p contenteditable data-f="addr">'+esc($("addr").value)+'</p>'+
   '<small><span contenteditable data-f="codelbl">'+esc($("codelbl").value)+'</span> <span contenteditable data-f="code">'+esc($("code").value)+'</span></small></div></div>';
  const wave='<svg viewBox="0 0 800 34" preserveAspectRatio="none"><path d="M0 34V14C100 34 200 0 330 12s250 24 470 -6V34Z" fill="#fff"/></svg>';
  if(style=="1")return '<div class="h1">'+t+wave+'</div>';
  if(style=="2")return '<div class="h2">'+t+'</div>';
  if(style=="3")return '<div class="h3">'+t+'</div>';
  return '<div class="h4">'+t+'</div>';
}
function foot(){
  const r='<div class="r"><span>✉️ <span contenteditable data-f="email">'+esc($("email").value)+'</span></span><span>📞 <span contenteditable data-f="mob">'+esc($("mob").value)+'</span></span><span>📍 <span contenteditable data-f="addr">'+esc($("addr").value)+'</span></span></div>';
  const wave='<svg viewBox="0 0 800 26" preserveAspectRatio="none"><path d="M0 0H800V8C700 26 560 0 400 12S100 24 0 6Z" fill="#fff"/></svg>';
  if(style=="1")return '<div class="ft f1">'+wave+r+'</div>';
  if(style=="2")return '<div class="ft f2">'+r+'</div>';
  if(style=="3")return '<div class="ft f3">'+r+'</div>';
  return '<div class="ft f4">'+r+'</div>';
}
const LETTER=()=>'<div class="lr"><span contenteditable>જા.નં.: ________</span><span contenteditable>તારીખ: '+today()+'</span></div>'+
 '<div contenteditable style="margin-top:10px">પ્રતિ,<br>શ્રી ____________________,<br>____________________.</div>'+
 '<div contenteditable style="margin-top:10px"><b>વિષય:</b> ______________________________________</div>'+
 '<div contenteditable style="margin-top:10px">માનનીય શ્રી,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ઉપરોક્ત વિષય અન્વયે જણાવવાનું કે ____________________________________________________________________________________________________________.<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;આ બાબતે યોગ્ય કાર્યવાહી કરવા વિનંતી છે.</div>'+
 '<div class="sig" contenteditable>આપનો વિશ્વાસુ,<br><br><br>(શ્રી આનંદભાઈ મોદી)<br>સી.આર.સી. કો-ઓર્ડિનેટર</div>';
const TITLE=()=>'<div class="tt"><div class="rib" contenteditable>ફાઈલ</div>'+
 '<div class="big" contenteditable>શાળા રેકોર્ડ ફાઈલ</div><div class="sub" contenteditable>શૈક્ષણિક વર્ષ: 2026–27</div>'+
 '<div class="seal"'+(logoURL?'':' contenteditable')+'>'+(logoURL?'<img src="'+logoURL+'">':"📘")+'</div>'+
 '<table class="tb"><tr><td contenteditable>વિષય</td><td contenteditable>____________________</td></tr>'+
 '<tr><td contenteditable>શાળા / ક્લસ્ટર</td><td contenteditable>'+esc($("org").value)+'</td></tr>'+
 '<tr><td contenteditable>તાલુકો / જિલ્લો</td><td contenteditable>'+esc($("addr").value)+'</td></tr>'+
 '<tr><td contenteditable>તૈયાર કરનાર</td><td contenteditable>શ્રી આનંદભાઈ મોદી</td></tr>'+
 '<tr><td contenteditable>સંપર્ક</td><td contenteditable>'+esc($("mob").value)+'</td></tr></table></div>';

const CREDIT="આનંદભાઈ મોદી-૯૪૨૭૯૧૪૦૧૪";let LOCK=false;
function creditOK(){const c=document.getElementById("credit");return c&&c.textContent===CREDIT&&c.getAttribute("contenteditable")==="false"&&c.parentNode===$("page")}
new MutationObserver(()=>{if(LOCK||creditOK())return;LOCK=true;
  const c=document.getElementById("credit");if(c)c.remove();
  const d=document.createElement("div");d.id="credit";d.className="credit s"+style+(mode=="title"?" tpc":"");
  d.setAttribute("contenteditable","false");d.setAttribute("unselectable","on");d.textContent=CREDIT;$("page").prepend(d);LOCK=false;
}).observe(document.getElementById("page"),{subtree:true,childList:true,characterData:true,attributes:true});
document.addEventListener("beforeinput",e=>{if(e.target.closest&&e.target.closest("#credit"))e.preventDefault()});
document.addEventListener("input",e=>{const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  const v=e.target.textContent;$(f).value=v;
  document.querySelectorAll('[data-f="'+f+'"]').forEach(x=>{if(x!==e.target)x.textContent=v});});
function saveBody(){const b=document.querySelector(".bd");if(b&&mode!="blank")bodyHTML[mode]=b.innerHTML}
function build(){
  const p=$("page");p.className="page"+(mode=="title"?" tp":"");
  let inner="";
  if(mode=="letter")inner=bodyHTML.letter||LETTER();
  else if(mode=="title")inner=bodyHTML.title||TITLE();
  LOCK=true;p.innerHTML='<div id="credit" class="credit s'+style+(mode=="title"?" tpc":"")+'" contenteditable="false" unselectable="on">'+CREDIT+'</div><div class="wm">'+(logoURL?'<img src="'+logoURL+'">':"🏫")+'</div>'+head()+'<div class="bd" contenteditable="true"'+(mode=="title"?' style="padding:0"':'')+'>'+inner+'</div>'+foot();
  LOCK=false;fit();
}
function fit(){
  const w=Math.min(window.innerWidth-16,794),s=w/794,f=$("fit");
  if(matchMedia("print").matches)return;
  $("page").style.transform="scale("+s+")";f.style.width=794*s+"px";f.style.height=1123*s+"px";
}
async function dlPDF(){
  const btn=$("pdfbtn"),pg=$("page"),f=$("fit"),old=[pg.style.transform,f.style.width,f.style.height,f.style.overflow];
  if(!window.html2canvas||!window.jspdf){alert("PDF લાઈબ્રેરી લોડ થઈ નથી. ઈન્ટરનેટ તપાસો.");return}
  btn.disabled=true;btn.textContent="⏳ PDF બની રહી છે...";
  try{
    if(document.activeElement)document.activeElement.blur();
    await document.fonts.ready;
    pg.style.transform="none";f.style.width="794px";f.style.height="1123px";f.style.overflow="visible";
    const cv=await html2canvas(pg,{scale:2.5,backgroundColor:"#ffffff",useCORS:true,scrollX:0,scrollY:-window.scrollY});
    const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
    doc.addImage(cv.toDataURL("image/jpeg",.96),"JPEG",0,0,210,297);
    doc.save((mode=="title"?"File_Title_Page":"Letter_Pad")+".pdf");
  }catch(e){alert("PDF બનાવવામાં ભૂલ આવી. 'પ્રિન્ટ' બટન વાપરી જુઓ.")}
  pg.style.transform=old[0];f.style.width=old[1];f.style.height=old[2];f.style.overflow=old[3];fit();
  btn.disabled=false;btn.textContent="⬇️ PDF ડાઉનલોડ (પ્રિવ્યુ જેવું જ)";
}
addEventListener("resize",fit);
addEventListener("beforeprint",()=>{$("page").style.transform="none"});
addEventListener("afterprint",fit);
build();
</script>
</body>
</html>
