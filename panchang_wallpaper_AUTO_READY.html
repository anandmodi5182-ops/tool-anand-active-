function dayData(y,m,d){const k=y*10000+m*100+d;if(cache[k])return cache[k];
 const a=sunTimes(Date.UTC(y,m,d)),b=sunTimes(Date.UTC(y,m,d+1));
 const L=a.set-a.rise,mom={S:a.rise,M:a.rise+.5*L,A:a.rise+.7*L,E:a.set+36e5,N:a.set+(b.rise-a.set)/2},tt={},ll={};
 for(const w in mom){tt[w]=tithiIdx(mom[w]);ll[w]=lunar(mom[w]);}
 const ksh=tithiIdx(b.rise)===(tt.S+2)%30?(tt.S+1)%30:-1,fest=[];
 for(const f of FEST){const l=ll[f[2]];if(!l.adhik&&l.m===f[0]&&(tt[f[2]]===f[1]||(f[2]==='S'&&ksh===f[1])))fest.push(f[3]);}
 {const q=sunTimes(Date.UTC(y,m,d-1)),e=q.set+36e5,l=lunar(e);if(!l.adhik&&l.m===11&&tithiIdx(e)===14)fest.push('ધુળેટી');}
 const fx=FIXED[(m+1)+'-'+d];if(fx)fest.push(fx);
 return cache[k]={t:tt.S,lm:ll.S,fest,rise:a.rise,set:a.set,nrise:b.rise};}
//ENGINE_END
function fests(y,m,d){const x=new Date(Date.UTC(y,m,d-1)),pv=dayData(x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate()).fest;return dayData(y,m,d).fest.filter(n=>!pv.includes(n));}
const GM=['જાન્યુઆરી','ફેબ્રુઆરી','માર્ચ','એપ્રિલ','મે','જૂન','જુલાઈ','ઓગસ્ટ','સપ્ટેમ્બર','ઓક્ટોબર','નવેમ્બર','ડિસેમ્બર'];
const WD=['રવિવાર','સોમવાર','મંગળવાર','બુધવાર','ગુરુવાર','શુક્રવાર','શનિવાર'],WS=['ર','સો','મં','બુ','ગુ','શુ','શ'];
const NK=['અશ્વિની','ભરણી','કૃતિકા','રોહિણી','મૃગશીર્ષ','આર્દ્રા','પુનર્વસુ','પુષ્ય','આશ્લેષા','મઘા','પૂર્વા ફાલ્ગુની','ઉત્તરા ફાલ્ગુની','હસ્ત','ચિત્રા','સ્વાતિ','વિશાખા','અનુરાધા','જ્યેષ્ઠા','મૂળ','પૂર્વાષાઢા','ઉત્તરાષાઢા','શ્રવણ','ધનિષ્ઠા','શતભિષા','પૂર્વાભાદ્રપદ','ઉત્તરાભાદ્રપદ','રેવતી'];
const YG=['વિષ્કુંભ','પ્રીતિ','આયુષ્માન','સૌભાગ્ય','શોભન','અતિગંડ','સુકર્મા','ધૃતિ','શૂલ','ગંડ','વૃદ્ધિ','ધ્રુવ','વ્યાઘાત','હર્ષણ','વજ્ર','સિદ્ધિ','વ્યતિપાત','વરીયાન','પરિઘ','શિવ','સિદ્ધ','સાધ્ય','શુભ','શુક્લ','બ્રહ્મ','ઐન્દ્ર','વૈધૃતિ'];
const KN=['બવ','બાલવ','કૌલવ','તૈતિલ','ગર','વણિજ','વિષ્ટિ (ભદ્રા)'];
const karanName=k=>k===0?'કિંસ્તુઘ્ન':k>=57?['શકુનિ','ચતુષ્પદ','નાગ'][k-57]:KN[(k-1)%7];
const RS=['મેષ','વૃષભ','મિથુન','કર્ક','સિંહ','કન્યા','તુલા','વૃશ્ચિક','ધનુ','મકર','કુંભ','મીન'];
const CH=['ઉદ્વેગ','ચલ','લાભ','અમૃત','કાળ','શુભ','રોગ'],CHG=[0,1,1,1,0,1,0],CHS=[0,3,6,2,5,1,4];
const hm=ms=>{const p=parts(ms);return g((p.h%12)||12)+':'+g(String(p.mi).padStart(2,'0'));};
const per=h=>h<4?'રાત્રે':h<12?'સવારે':h<16?'બપોરે':h<19?'સાંજે':'રાત્રે';
function when(ms,ref){const p=parts(ms),r=parts(ref);const nx=Date.UTC(p.y,p.m,p.d)>Date.UTC(r.y,r.m,r.d)?' (કાલે)':'';return per(p.h)+' '+hm(ms)+nx;}
const $=id=>document.getElementById(id);
const monthLabel=l=>(l.adhik?'અધિક ':'')+MON[l.m];

function tick(){const now=Date.now(),p=parts(now);
 $('ck').textContent=g((p.h%12)||12)+':'+g(String(p.mi).padStart(2,'0'));
 $('cs').textContent=g(String(p.s).padStart(2,'0'));
 $('cp').textContent=per(p.h);}

let calKey='';
function renderCalendar(p){const key=p.y+'-'+p.m;
 const fi=new Date(Date.UTC(p.y,p.m,1)).getUTCDay(),nd=new Date(Date.UTC(p.y,p.m+1,0)).getUTCDate(),rows=Math.ceil((fi+nd)/7);
 let h=WS.map(x=>`<div class="w">${x}</div>`).join('')+'<div></div>'.repeat(fi);
 for(let d=1;d<=nd;d++){const o=dayData(p.y,p.m,d),t=o.t;
  const c=['d'];if(t===14)c.push('pu');if(t===29)c.push('am');if(t===10||t===25)c.push('ek');
  const fl=fests(p.y,p.m,d);if(fl.length)c.push('fe');if(d===p.d)c.push('td');
  const lab=(t%15===0&&t<29?pk(t)+' ':'')+tName(t);
  h+=`<div class="${c.join(' ')}" title="${fl.join(', ')}"><b>${g(d)}</b><i>${lab}</i></div>`;}
 const cal=$('cal');cal.style.gridTemplateRows=`auto repeat(${rows},1fr)`;cal.innerHTML=h;
 $('cm').textContent=GM[p.m]+' '+g(p.y);}

function renderFest(p){const out=[];
 for(let i=0;i<120&&out.length<5;i++){const x=new Date(Date.UTC(p.y,p.m,p.d+i)),y=x.getUTCFullYear(),m=x.getUTCMonth(),d=x.getUTCDate();
  for(const n of fests(y,m,d)){if(out.length<5)out.push({y,m,d,n,i});}}
 $('fs').innerHTML=out.map(e=>`<div class="fi"><b>${g(e.d)} ${GM[e.m]}${e.i===0?' (આજે)':''}</b><span>${e.n}</span></div>`).join('');}

function renderPanchang(){const now=Date.now(),p=parts(now);
 let vd={y:p.y,m:p.m,d:p.d},di=dayData(vd.y,vd.m,vd.d);
 if(now<di.rise){const x=new Date(Date.UTC(p.y,p.m,p.d-1));vd={y:x.getUTCFullYear(),m:x.getUTCMonth(),d:x.getUTCDate()};di=dayData(vd.y,vd.m,vd.d);}
 const vwd=new Date(Date.UTC(vd.y,vd.m,vd.d)).getUTCDay(),lm=di.lm,t0=di.t;
 const vs=p.y+56+((lm.m>=7&&p.m>=8)?1:0);
 $('gd').textContent=`${monthLabel(lm)} ${pk(t0)} ${tName(t0)}`;
 $('dd').textContent=`${WD[p.wd]}, ${g(p.d)} ${GM[p.m]} ${g(p.y)}`;
 $('vs').textContent=`વિક્રમ સંવત ${g(vs)}`;
 const tn=tithiIdx(now),te=nextChange(tithiIdx,now),sunriseEnd=nextChange(tithiIdx,di.rise);
 const nk=nakIdx(now),yg=yogaIdx(now),kr=karanIdx(now),rs=Math.floor(norm(moonLon(now)-ayan(now))/30);
 const ln=(di.set-di.rise)/8,ri=[8,2,7,5,6,4,3][vwd]-1,r0=di.rise+ri*ln;
 const R=(a,b,s)=>`<div class="row"><span>${a}</span><b>${b}${s?`<small>${s}</small>`:''}</b></div>`;
 $('pg').innerHTML=
  R('સૂર્યોદયે તિથિ',`${pk(t0)} ${tName(t0)}`,'સુધી '+when(sunriseEnd,now))+
  R('અત્યારે તિથિ',`${pk(tn)} ${tName(tn)}`,'સુધી '+when(te,now))+
  R('નક્ષત્ર',NK[nk],'સુધી '+when(nextChange(nakIdx,now),now))+
  R('યોગ',YG[yg],'સુધી '+when(nextChange(yogaIdx,now),now))+
  R('કરણ',karanName(kr),'સુધી '+when(nextChange(karanIdx,now),now))+
  R('ચંદ્ર રાશિ',RS[rs],'')+
  R('સૂર્યોદય / સૂર્યાસ્ત',`${hm(di.rise)} / ${hm(di.set)}`,'')+
  R('રાહુકાળ',`${hm(r0)} – ${hm(r0+ln)}`,'');
 const dl=(di.set-di.rise)/8,nl=(di.nrise-di.set)/8,s0=CHS[vwd],n0=(s0+5)%7;
 const slot=(a,b,i,k)=>{const c=CHG[k],cur=now>=a&&now<b;return `<div class="sl ${c?'g':'n'}${cur?' now':''}">${CH[k]}<em>${hm(a)}–${hm(b)}</em></div>`;};
 let d='',n='';
 for(let i=0;i<8;i++){d+=slot(di.rise+i*dl,di.rise+(i+1)*dl,i,(s0+i)%7);n+=slot(di.set+i*nl,di.set+(i+1)*nl,i,(n0+5*i)%7);}
 $('cd').innerHTML=d;$('cn').innerHTML=n;}

function refresh(){const p=parts(Date.now());const k=p.y+'-'+p.m+'-'+p.d;
 if(k!==calKey){calKey=k;renderCalendar(p);renderFest(p);}
 renderPanchang();}
tick();refresh();
setInterval(tick,1000);setInterval(refresh,30000);
</script>
