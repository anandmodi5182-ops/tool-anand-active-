<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anand Tools Store</title>
<style>
:root{--bg:#0a0e1f;--bg2:#141a3a;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.14);--tx:#eef1ff;--mu:#9aa3cc;--gold:#ffb938;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#eef1fb;--bg2:#dfe5f8;--card:rgba(255,255,255,.85);--bd:rgba(20,30,80,.14);--tx:#13183a;--mu:#555e8a}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--tx);font-family:"Noto Sans Gujarati",Shruti,"Nirmala UI",system-ui,sans-serif;background:radial-gradient(circle at 15% 10%,#2b2d86 0,transparent 45%),radial-gradient(circle at 85% 90%,#0e6b73 0,transparent 40%),linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;padding:24px 16px 60px}
.w{max-width:1040px;margin:0 auto}
header{text-align:center;padding:26px 0 8px;perspective:700px}
.logo{display:inline-block;font-size:54px;animation:fl 5s ease-in-out infinite;filter:drop-shadow(0 14px 14px rgba(0,0,0,.45))}
@keyframes fl{50%{transform:translateY(-8px) rotateY(25deg)}}
h1{margin:6px 0 4px;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:1px;text-shadow:0 1px 0 #3b5bdb,0 2px 0 #3351c4,0 3px 0 #2c46ad,0 4px 0 #263d98,0 10px 18px rgba(0,0,0,.45)}
.sub{color:var(--mu);margin:0}
.sub b{color:var(--gold)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:26px 0 8px}
.st{padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--bd);display:flex;gap:12px;align-items:center;font-size:.92rem}
.st i{font-style:normal;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(145deg,#5b7bff,#2c46ad);box-shadow:0 4px 0 #1e3180}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 18px;border-radius:999px;font:inherit;cursor:pointer;transition:.15s}
.chip.on{background:linear-gradient(145deg,#5b7bff,#3b5bdb);color:#fff;border-color:transparent;box-shadow:0 4px 0 #263d98}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;perspective:1100px}
.card{position:relative;padding:22px;border-radius:20px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(10px);transform-style:preserve-3d;transition:transform .15s ease-out,box-shadow .25s;box-shadow:0 18px 40px rgba(0,0,0,.28);will-change:transform}
.card:hover{box-shadow:0 28px 60px rgba(0,0,0,.4)}
.ic{font-size:44px;display:inline-block;transform:translateZ(40px);filter:drop-shadow(0 10px 8px rgba(0,0,0,.4))}
.card h3{margin:10px 0 2px;font-size:1.1rem;transform:translateZ(24px)}
.card p{margin:0 0 6px;color:var(--mu);font-size:.88rem;transform:translateZ(14px)}
.tag{display:inline-block;font-size:.72rem;padding:3px 10px;border-radius:999px;background:rgba(255,185,56,.16);color:var(--gold);border:1px solid rgba(255,185,56,.35)}
.tag.f{background:rgba(45,226,196,.14);color:#2de2c4;border-color:rgba(45,226,196,.35)}
.pr{margin:10px 0 14px;font-weight:700;font-size:1.05rem;transform:translateZ(20px)}
.row{display:flex;gap:12px;flex-wrap:wrap;transform:translateZ(30px)}
.b3{--c:#3b5bdb;--d:#263d98;flex:1;min-width:110px;border:0;padding:12px 16px;border-radius:12px;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center;justify-content:center;background:linear-gradient(180deg,color-mix(in srgb,var(--c),#fff 22%),var(--c));box-shadow:0 6px 0 var(--d),0 12px 16px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent}
.b3:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--d),0 16px 20px rgba(0,0,0,.4)}
.b3:active{transform:translateY(6px);box-shadow:0 0 0 var(--d),0 3px 6px rgba(0,0,0,.3)}
.b3.buy{--c:#f59f00;--d:#b56f00;color:#1c1300}
.b3.dl{--c:#0ca678;--d:#087f5b}
.b3.wa{--c:#25d366;--d:#17913f;color:#05230f}
.b3.gh{--c:#4b5382;--d:#2e3560}
.b3.big{flex:none;width:100%}
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(3,6,18,.72);backdrop-filter:blur(6px)}
.ov.on{display:flex}
.md{width:min(440px,100%);max-height:94vh;overflow:auto;padding:22px;border-radius:22px;background:linear-gradient(160deg,#1b2250,#0e1330);color:#eef1ff;border:1px solid rgba(255,255,255,.18);box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.85) rotateX(14deg)}}
.md h2{margin:0 0 2px;font-size:1.2rem}
.md .mu{color:#9aa3cc;font-size:.88rem;margin:0 0 12px}
.qr{display:block;margin:10px auto;width:230px;max-width:70%;border-radius:16px;background:#fff;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.upi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.35);border:1px dashed #2de2c4;color:#2de2c4;font-size:.95rem;margin:8px 0 14px;word-break:break-all}
.upi button{flex:none;border:0;border-radius:8px;padding:6px 10px;background:#1d2447;color:#fff;font:inherit;cursor:pointer}
ol{margin:0 0 16px;padding-left:20px;font-size:.88rem;color:#c8cff0;line-height:1.7}
.mb{display:grid;gap:12px}
.x{position:sticky;float:right;top:0;border:0;background:rgba(255,255,255,.12);color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}
footer{text-align:center;color:var(--mu);font-size:.8rem;margin-top:40px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:#0ca678;color:#fff;padding:10px 18px;border-radius:999px;transition:.25s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 {n:'ComputerCheck',d:'PC ચેક પ્રોગ્રામ (Windows)',i:'💻',t:'exe',f:'ComputerCheck.exe',p:0},
 {n:'Office Order Full',d:'ફુલ પ્રોગ્રામ (Windows)',i:'📦',t:'exe',f:'Office_Order_Full.exe',p:0},
 {n:'PC Cleaner',d:'PC સાફ કરવાનો પ્રોગ્રામ',i:'🧹',t:'exe',f:'PC_Cleaner.exe',p:0}
];

var $=function(i){return document.getElementById(i)};
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},1800)}
function price(t){return t.free?'મફત':(t.p?'₹'+t.p:'કિંમત માટે WhatsApp')}

function render(f){
 $('grid').innerHTML=TOOLS.map(function(t,i){
  if(f!=='all'&&t.t!==f)return'';
  var open=t.t==='exe'?'<a class="b3 dl" href="'+t.f+'" data-go="'+i+'" data-dl="1">⬇ Download</a>':'<a class="b3" href="'+t.f+'" data-go="'+i+'">▶ ખોલો</a><a class="b3 dl" href="'+t.f+'" download data-go="'+i+'" data-dl="1">⬇ Download</a>';
  var buy=t.free?'':'<button class="b3 buy" data-i="'+i+'">🛒 ખરીદો</button>';
  return '<div class="card"><span class="ic">'+t.i+'</span><h3>'+t.n+'</h3><p>'+t.d+'</p><span class="tag'+(t.free?' f':'')+'">'+(t.t==='exe'?'Windows':'Online')+'</span><div class="pr">'+price(t)+'</div><div class="row">'+open+buy+'</div></div>'}).join('');
 tilt();
}
$('chips').onclick=function(e){var b=e.target.closest('.chip');if(!b)return;document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on')});b.classList.add('on');render(b.dataset.f)};
/* ફાઇલના નામમાં _1 જેવો ફેરફાર હોય તો પણ આપોઆપ સાચી ફાઇલ શોધીને ખોલે */
function cands(t){var a=[t.f,t.f.replace(/(\.\w+)$/,'_1$1')];return t.x?a.concat(t.x):a}
function save(u){var a=document.createElement('a');a.href=u;a.download=u.split('/').pop();document.body.appendChild(a);a.click();a.remove()}
function go(t,dl){
 dl=dl||t.t==='exe';
 if(location.protocol==='file:'){if(dl)save(t.f);else location.href=t.f;return}
 var l=cands(t),i=0;
 (function nx(){
  if(i>=l.length){toast('❌ ફાઇલ મળી નથી: '+t.f);return}
  var u=l[i++];
  fetch(u,{method:'HEAD',cache:'no-store'}).then(function(r){
   if(!r.ok)throw 0;
   if(dl)save(u);else location.href=u
  }).catch(nx)})()}
$('grid').onclick=function(e){
 var g=e.target.closest('[data-go]');if(g){e.preventDefault();go(TOOLS[g.dataset.go],!!g.dataset.dl);return}
 var b=e.target.closest('.buy');if(b)buy(TOOLS[b.dataset.i])};

/* 3D tilt */
function tilt(){
 if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
 document.querySelectorAll('.card').forEach(function(c){
  c.onpointermove=function(e){var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform='rotateY('+(x*14)+'deg) rotateX('+(-y*14)+'deg) translateZ(8px)'};
  c.onpointerleave=function(){c.style.transform=''}})}

/* Buy modal */
function buy(t){
 var amt=t.p?t.p:'',msg='નમસ્તે, મારે આ ટૂલ ખરીદવું છે: '+t.n+'\nમેં ચૂકવણી કરી દીધી છે (Screenshot સાથે મોકલું છું).\nમારો Access Code: ',
 upiLink='upi://pay?pa='+UPI+'&pn='+encodeURIComponent(PAYEE)+(amt?'&am='+amt:'')+'&cu=INR&tn='+encodeURIComponent(t.n),
 waLink='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);
 $('md').innerHTML='<button class="x" id="mx" aria-label="બંધ કરો">✕</button><h2>🛒 '+t.n+'</h2><p class="mu">'+price(t)+' · '+PAYEE+'</p>'
  +'<img class="qr" alt="UPI QR" src="'+QR+'">'
  +'<div class="upi"><span>UPI ID: <b>'+UPI+'</b></span><button id="cp">📋 Copy</button></div>'
  +'<ol><li>QR સ્કેન કરો અથવા નીચેના બટનથી UPI App ખોલો.</li><li>ચૂકવણી પછી <b>Screenshot</b> લો.</li><li>ટૂલ ખોલી તેનો <b>Access Code</b> કૉપિ કરો.</li><li>Screenshot + Code WhatsApp પર મોકલો.</li></ol>'
  +'<div class="mb"><a class="b3 buy big" href="'+upiLink+'">📲 UPI App થી ચૂકવો</a><a class="b3 wa big" target="_blank" rel="noopener" href="'+waLink+'">💬 Screenshot WhatsApp કરો</a></div>';
 $('ov').classList.add('on');
 $('mx').onclick=close;
 $('cp').onclick=function(){navigator.clipboard?navigator.clipboard.writeText(UPI).then(function(){toast('✔ UPI ID કૉપિ થયું')},function(){toast('જાતે કૉપિ કરો')}):toast('જાતે કૉપિ કરો')};
}
function close(){$('ov').classList.remove('on')}
$('ov').onclick=function(e){if(e.target===this)close()};
document.onkeydown=function(e){if(e.key==='Escape')close()};
render('all');
</script>
</body>
